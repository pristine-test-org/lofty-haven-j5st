<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Why it helps · Olive</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c1c1c; background: #fafaf7; }
      body { margin: 0; }
      header, footer { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      header a { color: #2f7d4f; }
      .mark { font-weight: 700; color: #2f7d4f; }
      main { max-width: 44rem; margin: 0 auto; padding: 3rem 0; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
        margin: 0 1rem 1rem;
        background: linear-gradient(90deg, #2f7d4f, #d9b92e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edges, no background. */
      .lead { margin: 0; padding: 0; line-height: 1.6; max-width: none; }
      .wrap { max-width: none; margin: 0; padding: 0; }
      /* Intentional, for Impeccable's test drive: colour outside the palette, and low-contrast grey text. */
      .note { color: #c9c9c9; margin: 1rem; }
      .tag { color: #b8451f; margin: 1rem; }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .small-link { font-size: 10px; color: #2f7d4f; margin-left: 1rem; }
      /* Intentional, for Impeccable's test drive: transition on a layout property. */
      .meter { height: 0.5rem; width: 30%; margin: 1rem; background: #2f7d4f; border-radius: 0.25rem; transition: width 0.3s; }
      .meter:hover { width: 80%; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">Olive</span>
      <a href="/">Back to the front door</a>
    </header>
    <main>
      <h1>Why it helps</h1>
      <div class="wrap">
        <p class="lead">One calm page tells a visitor what the list is for and what is on it right now, so nobody has to ask a teammate what is going on before they get started.</p>
      </div>
      <p class="note">Less to explain means fewer questions on a busy morning.</p>
      <p class="tag">Calm by default.</p>
      <div class="meter" aria-hidden="true"></div>
      <a class="small-link" href="/">Return to the list</a>
    </main>
    <footer>Olive</footer>
  </body>
</html>
